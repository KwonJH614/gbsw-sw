spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hooppath}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:hooppath}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:HoopPathSecretKeyForJwtTokenGeneration2026SpringBoot}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  notification:
    schedule-enabled: ${NOTIFICATION_SCHEDULE_ENABLED:true}
    schedule-cron: "${NOTIFICATION_SCHEDULE_CRON:0 0 9 * * *}"
    inactive-days: ${NOTIFICATION_INACTIVE_DAYS:7}
    demo-webhook-url: ${DISCORD_WEBHOOK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
  info:
    env:
      enabled: true

info:
  app:
    name: HoopPath
    stage: P3
